name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No build step: Vercel builds apps/web on every push and a failure there
      # already blocks the deploy. What is left is the part Vercel never does.
      # `typecheck` covers packages/extension too, which Vercel never compiles.
      - run: pnpm typecheck
      - run: pnpm test

      - name: Check migrations are committed
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::Schema changed without a committed migration. Run pnpm db:generate."
            git --no-pager diff --stat packages/db/migrations
            exit 1
          fi
