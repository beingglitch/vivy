name: Android

on:
  push:
    tags: ['android-v*']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle distribution, the dependency cache and the build
      # cache. Without it every run re-downloads the whole Android toolchain,
      # which is most of the wall clock.
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tagged version
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          tagged=${GITHUB_REF_NAME#android-v}
          test -n "$name"
          test -n "$code"
          if [[ ! "$GITHUB_REF_NAME" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like android-v0.2.0" >&2
            exit 1
          fi
          if [ "$tagged" != "$name" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $name" >&2
            exit 1
          fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[].assets[].name | try capture("^vivy-.*-(?<code>[0-9]+)\\.apk$").code catch empty | tonumber] | max // 0')
          if [ "$code" -le "$previous" ]; then
            echo "versionCode $code must be greater than published build $previous" >&2
            exit 1
          fi
          echo "apk=vivy-${name}-${code}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${name}" >> "$GITHUB_OUTPUT"

      - name: Test and build release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - run: mv app/build/outputs/apk/release/app-release.apk "${{ steps.name.outputs.apk }}"

      # Downloadable from the run page for 90 days. This is the install path:
      # the phone opens the artifact, not a store.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/${{ steps.name.outputs.apk }}
          retention-days: 90

      # Publishing the release is what makes the build reachable: the web app
      # reads the latest release, serves the APK at /api/android/download, and
      # the phone's update check compares against it.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Android ${{ steps.name.outputs.version }}
          files: android/${{ steps.name.outputs.apk }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
